<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04060f">
<title>Offline — THE SYSTEM</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#04060f;
    color:#c8d8ff;
    font-family:'Orbitron',monospace;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;text-align:center;padding:24px;
    background-image:linear-gradient(rgba(77,111,255,.025) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(77,111,255,.025) 1px,transparent 1px);
    background-size:28px 28px;
  }
  .container{max-width:360px}
  .icon{font-size:64px;margin-bottom:24px;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{text-shadow:0 0 20px rgba(77,111,255,.4)}50%{text-shadow:0 0 40px rgba(77,111,255,1)}}
  .title{font-size:28px;font-weight:900;letter-spacing:6px;color:#e8f0ff;margin-bottom:8px;
    text-shadow:0 0 20px rgba(77,111,255,.8)}
  .sub{font-family:'Share Tech Mono',monospace;font-size:13px;color:#4a5a88;letter-spacing:2px;
    margin-bottom:8px;line-height:2}
  .msg{font-family:'Share Tech Mono',monospace;font-size:12px;color:#4a5a88;
    margin-bottom:32px;line-height:1.8}
  .btn{
    font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:2px;
    padding:12px 28px;border:1px solid #4d6fff;color:#fff;
    background:linear-gradient(135deg,#4d6fff,#7b4fff);
    cursor:pointer;text-decoration:none;display:inline-block;
    transition:all .2s;box-shadow:0 0 20px rgba(77,111,255,.3)
  }
  .btn:hover{box-shadow:0 0 30px rgba(77,111,255,.6);transform:translateY(-2px)}
  .btn:active{transform:scale(.97);opacity:.9}
  .divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,#4d6fff,transparent);
    margin:28px auto}
</style>
</head>
<body>
<div class="container">
  <div class="icon">⚡</div>
  <div class="title">THE SYSTEM</div>
  <div class="sub">CONNECTION LOST</div>
  <div class="divider"></div>
  <div class="msg">No network connection detected.<br>Reconnect to continue your journey.</div>
  <a class="btn" href="./index.html" onclick="window.location.reload()">[ RETRY CONNECTION ]</a>
</div>
</body>
</html>
